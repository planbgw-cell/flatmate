name: flatmate_app
description: "Flatmate — 자취방/단기임대 탐색 및 로컬 생활정보 앱"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0

  # Navigation (Web Deep Linking 및 앱 라우팅)
  go_router: ^13.2.0

  # Networking & Data
  dio: ^5.4.1
  json_annotation: ^4.12.0

  # Local Storage & Geo Location
  shared_preferences: ^2.2.2
  geolocator: ^14.0.0

  # UI Components
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2E6F5E"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F9F8F6"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#F9F8F6"
    icon_background_color: "#F9F8F6"
    image: assets/icon/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
