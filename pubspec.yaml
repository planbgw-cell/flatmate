name: flatmate_app
description: "Flatmate — 자취방/단기임대 탐색 및 로컬 생활정보 앱"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0

  # Navigation (Web Deep Linking 및 앱 라우팅)
  go_router: ^13.2.0

  # Networking & Data
  dio: ^5.4.1
  json_annotation: ^4.12.0

  # Local Storage & Geo Location
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0

  # UI Components
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
